<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Meta Stories 9:16 frame: tile-floor ink, logo inside the safe zone (below the top 14%),
       pole rules above and below the photo window (y 500–1540). The photo is composited separately. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C688"/><stop offset="0.55" stop-color="#C8A464"/><stop offset="1" stop-color="#A9852F"/>
    </linearGradient>
    <pattern id="tile" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="48" height="48" fill="#0D0B0A"/>
      <rect width="24" height="24" fill="#ECE6DA" fill-opacity="0.05"/>
      <rect x="24" y="24" width="24" height="24" fill="#ECE6DA" fill-opacity="0.05"/>
    </pattern>
    <pattern id="p" width="67" height="67" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="67" height="67" fill="#0D0B0A"/>
      <rect x="0" width="16" height="67" fill="#C8A464"/>
      <rect x="22" width="16" height="67" fill="#912731"/>
      <rect x="44" width="16" height="67" fill="#ECE6DA"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#tile)"/>
  <g transform="translate(178 270) scale(2.1)">
    <g transform="translate(48 48)">
      <circle r="44" fill="#0E0C0A" stroke="url(#g)" stroke-width="2.5"/>
      <circle r="37" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.7"/>
      <path d="M-12 -22 h14 c14 0 22 9 22 22 s-8 22 -22 22 h-14 z M-4 -15 v30 h6 c9 0 14 -6 14 -15 s-5 -15 -14 -15 z" fill="url(#g)" fill-rule="evenodd"/>
      <path d="M-30 30 L30 -30" stroke="#0E0C0A" stroke-width="5"/>
      <path d="M-30 30 L30 -30" stroke="url(#g)" stroke-width="1.4"/>
    </g>
    <text x="108" y="50" font-family="'Playfair Display'" font-size="38" font-weight="700" fill="url(#g)" letter-spacing="1">David&#8217;s</text>
    <text x="110" y="76" font-family="'Poppins'" font-size="12.5" font-weight="600" fill="#E8DCC4" letter-spacing="5.2">BARBER SHOP · 1972</text>
  </g>
  <rect y="486" width="1080" height="14" fill="url(#p)"/>
  <rect y="1540" width="1080" height="14" fill="url(#p)"/>
</svg>
